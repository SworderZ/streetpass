name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --split-per-abi --build-name="${GITHUB_REF_NAME#v}" --build-number="$GITHUB_RUN_NUMBER"
      - run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "../streetpass-${GITHUB_REF_NAME}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "../streetpass-${GITHUB_REF_NAME}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "../streetpass-${GITHUB_REF_NAME}-x86_64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: streetpass-${{ github.ref_name }}-*.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          flutter build windows --release --build-name="$version" --build-number="$env:GITHUB_RUN_NUMBER"
      - run: Copy-Item windows/README-Windows.txt build/windows/x64/runner/Release/README-Windows.txt
      - run: Copy-Item windows/runner/resources/app_icon.ico build/windows/x64/runner/Release/app_icon.ico
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "../streetpass-$env:GITHUB_REF_NAME-windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: streetpass-${{ github.ref_name }}-windows-x64.zip
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev
      - run: flutter pub get
      - run: flutter build linux --release --build-name="${GITHUB_REF_NAME#v}" --build-number="$GITHUB_RUN_NUMBER"
      - run: cp linux/README-Linux.txt build/linux/x64/release/bundle/README-Linux.txt
      - run: cp windows/runner/resources/app_icon.ico build/linux/x64/release/bundle/app_icon.ico
      - run: tar -czf "../streetpass-${GITHUB_REF_NAME}-linux-x64.tar.gz" -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: streetpass-${{ github.ref_name }}-linux-x64.tar.gz
          if-no-files-found: error

  publish:
    needs: [android, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
