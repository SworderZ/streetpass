name: Flutter cross-platform client

on:
  push:
    branches: [master]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter.yml'

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - run: flutter build linux --release
      - run: cp linux/README-Linux.txt build/linux/x64/release/bundle/README-Linux.txt
      - uses: actions/upload-artifact@v4
        with:
          name: streetpass-linux-release
          path: flutter_app/build/linux/x64/release/bundle

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: streetpass-flutter-android-debug
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - run: Copy-Item windows/README-Windows.txt build/windows/x64/runner/Release/README-Windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: streetpass-windows-release
          path: flutter_app/build/windows/x64/runner/Release
