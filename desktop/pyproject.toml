[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streetpass-desktop"
version = "0.1.0"
description = "StreetPass BLE protocol and desktop clients"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43,<46",
]

[tool.setuptools]
py-modules = ["streetpass_protocol"]
